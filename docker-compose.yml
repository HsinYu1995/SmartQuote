services:
  postgres:
    image: postgres:16-alpine
    container_name: smartquote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartquote}
      POSTGRES_USER: ${POSTGRES_USER:-smartquote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartquote_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smartquote-postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartquote} -d ${POSTGRES_DB:-smartquote}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartquote-postgres-data:
